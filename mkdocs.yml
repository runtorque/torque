site_name: Torque
site_description: iTerm2 agent and terminal orchestration
repo_url: https://github.com/runtorque/torque

theme:
  name: material
  palette:
    scheme: slate
    primary: blue
    accent: blue
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start Here:
      - Getting Started: getting-started.md
      - Concepts: concepts.md
      - Sessions: sessions.md
      - Agents & Sessions: agents-and-sessions.md
      - Group Settings: group-settings.md
      - Keyboard Shortcuts: keyboard-shortcuts.md
  - Workflows:
      - Workflow Guide: workflow-guide.md
      - Task Board: board.md
      - Task Lifecycle: task-lifecycle.md
      - Streams & Waves: streams-and-waves.md
      - Actions & Templates: actions.md
      - Agent Templates: agent-templates.md
      - Worktrees: worktrees.md
      - Schedules: schedules.md
      - Engineer: engineer.md
  - Operate Torque:
      - Operations: operations.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Reference Guide: reference-guide.md
      - CLI Reference: cli.md
      - Testing: testing.md
  - Project:
      - Architecture: architecture.md
      - Roadmap: roadmap.md
