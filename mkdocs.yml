site_name: Torque
site_description: iTerm2 agent and terminal orchestration
repo_url: https://github.com/runtorque/torque

theme:
  name: material
  palette:
    scheme: slate
    primary: blue
    accent: blue
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Foundations:
      - What is Torque?: foundations/what-is-torque.md
      - Why Torque exists: foundations/why-torque-exists.md
      - Getting started: foundations/getting-started.md
      - Core concepts: foundations/core-concepts.md
  - The team:
      - The team model: team/team-model.md
      - Workers: team/workers.md
      - Engineers: team/engineers.md
      - Architects: team/architects.md
      - MCP scoping: team/mcp-scoping.md
  - Tasks and pipelines:
      - Tasks and threads: tasks/threads.md
      - The board: tasks/board.md
      - Task lifecycle: tasks/lifecycle.md
      - Actions: tasks/actions.md
      - Templates: tasks/templates.md
      - Pipelines: tasks/pipelines.md
      - Worktrees: tasks/worktrees.md
      - Agent Templates: agent-templates.md
  - Operate Torque:
      - Workflow Guide: workflow-guide.md
      - Streams & Waves: streams-and-waves.md
      - Schedules: schedules.md
      - Sessions: sessions.md
      - Group Settings: group-settings.md
      - Keyboard Shortcuts: keyboard-shortcuts.md
      - Operations: operations.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Reference Guide: reference-guide.md
      - CLI Reference: cli.md
      - MCP tools: reference/mcp-tools.md
      - Testing: testing.md
  - Project:
      - Architecture: architecture.md
      - Roadmap: roadmap.md
