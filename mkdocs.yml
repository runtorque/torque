site_name: Torque
site_description: iTerm2 agent and terminal orchestration
repo_url: https://github.com/runtorque/torque

theme:
  name: material
  palette:
    scheme: slate
    primary: blue
    accent: blue
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Foundations:
      - What is Torque?: foundations/what-is-torque.md
      - Why Torque exists: foundations/why-torque-exists.md
      - Getting started: foundations/getting-started.md
      - Core concepts: foundations/core-concepts.md
  - The team:
      - The team model: team/team-model.md
      - Workers: team/workers.md
      - Engineers: team/engineers.md
      - Architects: team/architects.md
      - MCP scoping: team/mcp-scoping.md
  - Tasks and pipelines:
      - Tasks and threads: tasks/threads.md
      - The board: tasks/board.md
      - Task lifecycle: tasks/lifecycle.md
      - Actions: tasks/actions.md
      - Templates: tasks/templates.md
      - Pipelines: tasks/pipelines.md
      - Worktrees: tasks/worktrees.md
  - Operate Torque:
      - Workflow Guide: operate/workflow-guide.md
      - Streams & Waves: operate/streams-and-waves.md
      - Schedules: operate/schedules.md
      - Sessions: operate/sessions.md
      - Group Settings: operate/group-settings.md
      - Direct-message panel: operate/direct-message-panel.md
      - Board Sync: operate/board-sync.md
      - Keyboard Shortcuts: operate/keyboard-shortcuts.md
      - Operations: operate/operations.md
      - Manual testing: operate/manual-testing.md
  - Reference:
      - Detailed architecture: reference/architecture.md
      - CLI Reference: reference/cli.md
      - MCP tools: reference/mcp-tools.md
      - Roles and specializations: reference/specializations.md
      - Action YAML format: reference/action-yaml-format.md
      - Reference Guide: reference/reference-guide.md
      - iTerm2 API gotchas: reference/iterm2-gotchas.md
      - Claude Code hooks gotchas: reference/hooks-gotchas.md
      - Install locations: reference/install-locations.md
      - Troubleshooting: reference/troubleshooting.md
      - Testing: reference/testing.md
  - Project:
      - Architecture: architecture.md
      - Roadmap: roadmap.md
