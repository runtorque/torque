name: Bug report
description: Report a reproducible problem with Torque.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Torque. Please include enough detail for someone else to reproduce the issue.

  - type: input
    id: torque-version
    attributes:
      label: Torque version
      description: Paste the contents of the VERSION file from your checkout, or the release version you installed.
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS and version
      description: Torque is currently macOS + iTerm2 focused; include the macOS version and any relevant environment details.
      placeholder: "macOS 14.5"
    validations:
      required: true

  - type: input
    id: iterm-version
    attributes:
      label: iTerm2 version
      description: If applicable, include your iTerm2 version.
      placeholder: "iTerm2 3.5.0"
    validations:
      required: false

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      description: How did you install or run Torque?
      options:
        - make install
        - make standalone
        - torque desktop
        - Source checkout / development worktree
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps or commands that trigger the issue.
      placeholder: |
        1. Run `...`
        2. Open `...`
        3. Click `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include any error messages.
    validations:
      required: true

  - type: textarea
    id: logs-screenshots
    attributes:
      label: Logs, screenshots, or terminal output
      description: Attach screenshots or paste relevant logs. The daemon log is usually at `~/Library/Application Support/iTerm2/Scripts/torque/torque/torque.log`.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might help diagnose the issue, such as recent config changes or worktree state.
    validations:
      required: false
