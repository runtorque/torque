name: Release macOS

# Dispatch-to-release flow (TORQUE:806): a release is cut by running this workflow
# with a version. The workflow owns version handling end-to-end — it stamps all
# version sources, commits the bump to main, creates the annotated tag ON that
# commit, then builds and publishes. There is no manual multi-file bump and no
# assert-or-fail gate; the tag always points at the fully-bumped tree.
#
# To cut a release:    gh workflow run release-macos.yml -f version=2.2.0
# To validate safely:  gh workflow run release-macos.yml -f version=2.2.0 -f dry_run=true
#                      (builds from a throwaway tag, publishes a draft prerelease,
#                       then deletes the draft + throwaway tag/branch; main untouched)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, e.g. 2.2.0"
        required: true
        type: string
      dry_run:
        description: "Validate end-to-end without touching main (throwaway tag + draft prerelease, auto-cleaned)."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Cut version commit + tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cut.outputs.version }}
      tag: ${{ steps.cut.outputs.tag }}
      ref: ${{ steps.cut.outputs.ref }}
      dry_run: ${{ steps.cut.outputs.dry_run }}
      dryrun_branch: ${{ steps.cut.outputs.dryrun_branch }}
    steps:
      - name: Check out the dispatch ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Bump version, commit, and tag
        id: cut
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          version="${VERSION_INPUT#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Version must look like X.Y.Z. Got: $VERSION_INPUT" >&2
              exit 1
              ;;
          esac
          tag="v$version"
          dry_run="${DRY_RUN:-false}"

          # Real releases are always cut from main; dry runs may validate any branch.
          if [ "$dry_run" != "true" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Real releases must be dispatched from main (dispatched from: ${GITHUB_REF_NAME})." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never clobber an existing release on a real cut.
          if git ls-remote --tags --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            if [ "$dry_run" != "true" ]; then
              echo "Tag $tag already exists on origin. Bump to a new version." >&2
              exit 1
            fi
          fi

          # Single source of truth for which files carry the version.
          python3 scripts/set_release_version.py "$version"
          git add VERSION torque/__init__.py src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/Cargo.lock
          git commit \
            -m "Bump version to $version" \
            -m "Cut by the release-macos workflow (workflow_dispatch). Stamps the five version sources via scripts/set_release_version.py."

          if [ "$dry_run" = "true" ]; then
            run_tag="${tag}-dryrun.${GITHUB_RUN_ID}"
            dryrun_branch="ci/release-dryrun/${run_tag}"
            git push origin "HEAD:refs/heads/${dryrun_branch}"
            git tag -a "$run_tag" -m "Torque $version (dry run)"
            git push origin "refs/tags/${run_tag}"
            {
              echo "ref=$run_tag"
              echo "tag=$run_tag"
              echo "dryrun_branch=$dryrun_branch"
            } >> "$GITHUB_OUTPUT"
          else
            git push origin HEAD:main
            git tag -a "$tag" -m "Torque $version"
            git push origin "refs/tags/${tag}"
            {
              echo "ref=$tag"
              echo "tag=$tag"
              echo "dryrun_branch="
            } >> "$GITHUB_OUTPUT"
          fi
          {
            echo "version=$version"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            arch: aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: Intel
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Install Tauri CLI
        run: |
          set -euo pipefail
          tauri_version="$(awk '
            $0 == "name = \"tauri\"" { in_tauri = 1; next }
            in_tauri && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' src-tauri/Cargo.lock)"
          if [ -z "$tauri_version" ]; then
            echo "Unable to resolve Tauri version from src-tauri/Cargo.lock." >&2
            exit 1
          fi
          cargo install tauri-cli --locked --version "$tauri_version"

      - name: Resolve signing mode
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "has_certificate=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_certificate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple signing certificate
        if: ${{ steps.signing.outputs.has_certificate == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "APPLE_CERTIFICATE_PASSWORD is required when APPLE_CERTIFICATE is set." >&2
            exit 1
          fi

          keychain_password="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          certificate_path="$RUNNER_TEMP/torque-certificate.p12"
          keychain_path="$RUNNER_TEMP/torque-signing.keychain-db"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application|Apple Distribution|Apple Development/ { print $2; exit }')"
          if [ -z "$signing_identity" ]; then
            echo "No Apple code-signing identity found in imported certificate." >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Use ad-hoc signing without Apple certificate
        if: ${{ steps.signing.outputs.has_certificate == 'false' }}
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Resolve notarization credentials
        env:
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_ID_SECRET:-}" ] \
            && [ -z "${APPLE_PASSWORD_SECRET:-}" ] \
            && [ -z "${APPLE_TEAM_ID_SECRET:-}" ]; then
            echo "Apple notarization secrets are not configured; skipping notarization."
            exit 0
          fi

          if [ -z "${APPLE_ID_SECRET:-}" ] \
            || [ -z "${APPLE_PASSWORD_SECRET:-}" ] \
            || [ "${#APPLE_TEAM_ID_SECRET}" -lt 3 ]; then
            echo "Apple notarization secrets are incomplete; skipping notarization." >&2
            echo "Set APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID to enable notarization." >&2
            exit 0
          fi

          delimiter="$(uuidgen)"
          {
            echo "APPLE_ID<<$delimiter"
            printf '%s\n' "$APPLE_ID_SECRET"
            echo "$delimiter"
            echo "APPLE_PASSWORD<<$delimiter"
            printf '%s\n' "$APPLE_PASSWORD_SECRET"
            echo "$delimiter"
            echo "APPLE_TEAM_ID<<$delimiter"
            printf '%s\n' "$APPLE_TEAM_ID_SECRET"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Build Tauri bundle
        env:
          TORQUE_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd src-tauri
          cargo tauri build --bundles app,dmg --target ${{ matrix.target }}

      - name: Collect artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          dist_dir="dist/macos-${{ matrix.arch }}"
          mkdir -p "$dist_dir"

          dmg_path="$(find "$bundle_dir/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' -type d -print -quit)"

          if [ -z "$dmg_path" ]; then
            echo "No DMG produced under $bundle_dir/dmg." >&2
            exit 1
          fi
          if [ -z "$app_path" ]; then
            echo "No .app bundle produced under $bundle_dir/macos." >&2
            exit 1
          fi

          cp "$dmg_path" "$dist_dir/Torque-${VERSION}-macos-${{ matrix.arch }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$dist_dir/Torque-${VERSION}-macos-${{ matrix.arch }}.app.zip"

          (
            cd "$dist_dir"
            shasum -a 256 * > "SHA256SUMS-macos-${{ matrix.arch }}.txt"
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: torque-macos-${{ matrix.arch }}
          path: dist/macos-${{ matrix.arch }}/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: torque-macos-*
          path: dist
          merge-multiple: true

      - name: Add aggregate checksum file
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 \
              | sort -z \
              | xargs -0 shasum -a 256 > SHA256SUMS.txt
          )

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          args=(
            "$RELEASE_TAG"
            "${assets[@]}"
            --title "Torque ${RELEASE_TAG}"
            --generate-notes
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--draft --prerelease)
          fi

          gh release create "${args[@]}" --repo "$GITHUB_REPOSITORY"

  cleanup-dry-run:
    name: Clean up dry-run artifacts
    needs: [prepare, build, release]
    if: ${{ always() && needs.prepare.outputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete dry-run release, tag, and branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRYRUN_BRANCH: ${{ needs.prepare.outputs.dryrun_branch }}
        run: |
          set -uo pipefail

          # Remove the draft release and its throwaway tag (idempotent; ok if absent).
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            || echo "No release to delete for $TAG."
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              || echo "Could not delete tag $TAG."
          fi
          if [ -n "${DRYRUN_BRANCH:-}" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$DRYRUN_BRANCH" \
              || echo "Could not delete branch $DRYRUN_BRANCH."
          fi
