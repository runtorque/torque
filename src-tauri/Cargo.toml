[package]
name = "torque-desktop"
version = "2.0.0"
description = "Torque Tauri desktop shell"
authors = ["Torque contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "torque_desktop"
path = "src/lib.rs"

[[bin]]
name = "torque-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
ureq = { version = "2", features = ["json"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
