[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "torque-ee-connector"
version = "0.1.0"
description = "Enterprise-only Torque outbound connector package skeleton"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["torque_ee_connector*"]
