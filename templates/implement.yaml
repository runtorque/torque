name: implement
description: Implement a feature in an isolated worktree

agent:
  name_prefix: impl
  tab_color: "#3fb950"

worktree: true

labels:
  - feature

task: |
  {{ TASK }}

instructions: |
  Implement this feature on the current worktree branch.
  Write clean, minimal code — no speculative abstractions.
  Add or update tests to cover the new behavior.
  When done, leave the branch in a committable state with a clear commit message.

criteria: |
  - The feature works as described
  - Tests pass: `{{ TEST_COMMAND | default('npm test') }}`
  - No unrelated changes in the diff
