[package]
name = "loom-ui-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native macOS UI shell for Loom, built on AppKit via objc2."

[dependencies]
loom-core = { workspace = true }
loom-server = { workspace = true }
loom-ghostty = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

# AppKit bindings — gated behind the `appkit` feature so the workspace builds
# on non-macOS CI and we can iterate on the pure-Rust render logic without
# fighting objc2's feature matrix. Flip the feature on when you're wiring up
# windows on a Mac.
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.5"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.2"
optional = true
features = [
    "NSString",
    "NSArray",
    "NSGeometry",
    "NSRunLoop",
    "NSThread",
    "NSTimer",
    "NSDate",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.2"
optional = true
features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
    "NSView",
    "NSSplitView",
    "NSMenu",
    "NSMenuItem",
    "NSColor",
    "NSText",
    "NSTextView",
    "NSTextField",
    "NSControl",
    "NSGraphics",
    "NSScrollView",
    "NSFont",
    "NSFontManager",
    "NSFontDescriptor",
    "NSEvent",
]

[features]
default = []
appkit = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "loom-ghostty/ffi",
]
