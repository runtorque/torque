[workspace]
resolver = "2"
members = [
    "crates/loom-core",
    "crates/loom-actions",
    "crates/loom-worktree",
    "crates/loom-pty",
    "crates/loom-pty-supervisor",
    "crates/loom-adapters",
    "crates/loom-weaver",
    "crates/loom-server",
    "crates/loom-ghostty",
    "crates/loom-ui-native",
    "crates/loom-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["Aleksander Arruda"]
license = "MIT"
repository = "https://github.com/alekarruda/iterm2-loom"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# Web server
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Persistence
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }

# Templating (Jinja2 replacement)
minijinja = { version = "2.4", features = ["loader", "custom_syntax", "json"] }

# Git
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

# Terminal / PTY
portable-pty = "0.8"

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
bytes = "1"
percent-encoding = "2"
url = "2"
dirs = "5"
shell-words = "1.1"
base64 = "0.22"
libc = "0.2"

# Internal crates
loom-core = { path = "crates/loom-core" }
loom-actions = { path = "crates/loom-actions" }
loom-worktree = { path = "crates/loom-worktree" }
loom-pty = { path = "crates/loom-pty" }
loom-pty-supervisor = { path = "crates/loom-pty-supervisor" }
loom-adapters = { path = "crates/loom-adapters" }
loom-weaver = { path = "crates/loom-weaver" }
loom-server = { path = "crates/loom-server" }
loom-ghostty = { path = "crates/loom-ghostty" }
loom-ui-native = { path = "crates/loom-ui-native" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
