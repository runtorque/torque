name: oneshot/improvement
description: Improve existing functionality — refactoring, UX polish, performance, cleanup

agent:
  name_prefix: improve
  tab_color: "#d2a8ff"

prompt: |
  {% if loom.context.is_clean %}
  You are improving existing functionality. This is a refinement — not a new feature, not a bug fix. Focus on making what exists work better: cleaner code, better UX, improved performance, or reduced complexity.

  ## Task

  {{ loom.task.title }}

  {% if loom.task.description %}
  ## Context

  {{ loom.task.description }}
  {% endif %}

  ## Approach

  - Read the relevant code first to understand what exists
  - Keep changes focused on the improvement described — don't expand scope
  - Preserve existing behavior unless the task explicitly asks to change it
  - Do NOT deploy the changes
  {% else %}
  You have a new task. Follow the same approach as before — read the relevant code, then improve it cleanly in one pass. Do NOT deploy the changes.

  ## Task

  {{ loom.task.title }}

  {% if loom.task.description %}
  ## Context

  {{ loom.task.description }}
  {% endif %}
  {% endif %}

labels:
  - improvement
