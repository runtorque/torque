name: feature/review
description: Review the implementation for correctness

agent:
  name_prefix: review
  tab_color: "#a371f7"

labels:
  - feature

transitions:
  - action: feature/implement
    when: issues were found that need to be fixed
    status: "Fixing"
    target: parent

prompt: |
  A previous agent (`{{ loom.task.parent_agent_name or loom.task.parent_agent_slug }}`) implemented changes and your job is to check whether the work is correct, complete, and safe to merge.

  ## What was implemented

  {{ loom.task.title }}

  {% if loom.task.description %}
  ## Context

  {{ loom.task.description }}
  {% endif %}

  ## Review process

  - Read the full diff and verify that the code does what the task asked for
  - Run the narrowest relevant automated checks you can, add manual checks when practical, and note any deploy or live verification that still needs to happen
  - Separate blocking issues from follow-up suggestions so merge decisions are clear
  - Summarize merge risk: conflicts, migration/config/runtime risk, and any cleanup still needed

  ## Response format

  - **Blocking issues** — only issues that must be fixed before merge; say `None` if there are none
  - **Follow-up suggestions** — non-blocking improvements or cleanup ideas; say `None` if there are none
  - **Verification summary** — list the tests you ran, any manual checks you performed, and what deploy/live verification is still needed
  - **Merge-risk summary** — rate the merge risk as low / medium / high and explain why
  - **Verdict** — end with `Ship`, `Ship with fixes`, or `Needs rework`

  If there are blocking issues, call `loom_derive(description="Fix the issues found", action="feature/implement", context="...")` to send them back to the implementing agent. If there are no blocking issues, use `loom_done(message="brief review summary")` and keep any follow-up suggestions separate from the verdict.

  Do NOT fix issues yourself, deploy anything, or make changes. Only review and report.
