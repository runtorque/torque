name: feature/review
description: Review the implementation for correctness

agent:
  name_prefix: review
  tab_color: "#a371f7"

labels:
  - feature

auto_close_on_done: true

transitions:
  - action: feature/implement
    when: issues were found that need to be fixed
    status: "Fixing"
    target: parent

prompt: |
  A previous agent (`{{ loom.task.parent_agent_name or loom.task.parent_agent_slug }}`) implemented changes and your job is to check whether the work is correct, complete, and safe to merge.

  ## What was implemented

  {{ loom.task.title }}

  {% if loom.task.description %}
  ## Context

  {{ loom.task.description }}
  {% endif %}

  ## Review process

  - Read the full diff and verify that the code does what the task asked for
  - Run the narrowest relevant automated checks you can, add manual checks when practical, and note any deploy or live verification that still needs to happen
  - Separate blocking issues from follow-up suggestions so merge decisions are clear
  - Summarize merge risk: conflicts, migration/config/runtime risk, and any cleanup still needed

  ## Response format

  - **Blocking issues** — only issues that must be fixed before merge; say `None` if there are none
  - **Follow-up suggestions** — non-blocking improvements or cleanup ideas; say `None` if there are none
  - **Verification summary** — list the tests you ran, any manual checks you performed, and what deploy/live verification is still needed
  - **Merge-risk summary** — rate the merge risk as low / medium / high and explain why
  - **Verdict** — end with `Ship`, `Ship with fixes`, or `Revert`

  If there are blocking issues, call `loom_derive(description="Fix the issues found", action="feature/implement", context="...")` to send them back to the implementing agent. Include the blocking issues, verification summary, merge-risk summary, and `Ship with fixes` or `Revert` verdict in the derive context. Do NOT call `loom_done` after deriving a fix task; the unresolved fix handoff is the valid blocking-review closeout path. If there are no blocking issues, use `loom_done(message="brief review summary")` and keep any follow-up suggestions separate from the `Ship` verdict.

  Do NOT fix issues yourself, deploy anything, or make changes. Only review and report.

  ## Closeout (mandatory)

  Pick exactly one closeout path:
  - Blocking issues found: your FINAL action MUST be `loom ai derive "Fix the issues found" -a feature/implement` (or `loom_derive(...)`) with the required review context. Do NOT call `loom ai done` after deriving the fix task.
  - No blocking issues: your FINAL action MUST be `loom ai done` (or `loom_done(...)`) with a `Ship` verdict line stating there are no blocking issues and the work is ready to merge.

  Replying via `engineer_reply` or posting an `agent_reply` is NOT a substitute for either closeout path. Do not exit without calling the appropriate closeout tool. If tests are still running, call `loom ai progress "<status>"` periodically so the dispatching engineer knows you are alive — silence is read as a stall.
