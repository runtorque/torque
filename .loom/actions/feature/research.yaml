name: feature/research
description: Research a task, explore the codebase, and write an implementation plan
agent:
  name_prefix: research
  tab_color: '#58a6ff'
worktree: true
prompt: |
  You are researching a task and writing an implementation plan. Your goal is to deeply understand the problem, explore the relevant code, and produce a concrete plan that another agent will execute.

  ## Task

  {{ loom.task.title }}

  {% if loom.task.description %}
  ## Context

  {{ loom.task.description }}
  {% endif %}

  ## Phase 1: Research

  - Read the codebase to understand the relevant architecture, patterns, and conventions
  - Identify the files and modules that will need to change
  - Look for existing tests, related features, and potential conflicts
  - If the task description is unclear or missing critical details, ask the user for clarification before proceeding

  ## Phase 2: Plan

  Once you have enough context, write an implementation plan:

  - Break the work into discrete, ordered steps
  - For each step, specify which files change and what the change is
  - Call out any decisions that have trade-offs (and pick one with reasoning)
  - Note what tests need to be added or updated
  - Keep it actionable — every step should be something an agent can execute without ambiguity

  ## When the plan is ready

  Make the approval path explicit in your plan:

  - **Weaver approval is enough** for bounded, low-risk implementation plans that stay within the approved product direction and do not expand scope, change architecture, introduce migrations, or require sensitive operational decisions
  - **Human approval is required** for product behavior changes, scope expansion, architecture or API shifts, migrations, security/privacy implications, or anything else that needs product judgment

  If the plan needs human approval, ask for it with the `loom_ask` MCP tool so the user can review the plan in your output. If the plan is Weaver-approvable, say so explicitly in your final plan so the Weaver can approve and advance it. Do NOT derive to implementation before the appropriate approval has happened.

  If approval is granted and you transition or derive directly into implementation on the same agent, send an immediate `loom_progress(message="...")` update in the implementation task before doing more exploration so the board does not look idle.

  Do NOT write code, deploy anything, or make changes. Only research and plan.
labels:
- feature
transitions:
- action: feature/implement
  when: the user has reviewed and approved the plan
  status: Implementing
  target: self
- ask: true
  when: you need clarification or additional details from the user, or you're done
    planning and ready to present the plan to the user
