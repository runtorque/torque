name: pipeline/research
description: Research a task — explore the codebase and gather context before planning

agent:
  name_prefix: research
  tab_color: "#58a6ff"

worktree: true

labels:
  - pipeline

transitions:
  - action: pipeline/plan
    when: research is complete and you have enough context to write a plan
    status: "Planning"
    target: self
  - ask: true
    when: you need clarification or additional details from the user before proceeding

prompt: |
  You are researching a task before planning and implementing it. Your goal is to deeply understand the problem, explore the relevant code, and gather all the context needed to write a solid plan.

  ## Task

  {{ TASK }}

  {% if CONTEXT %}
  ## Context

  {{ CONTEXT }}
  {% endif %}

  ## Approach

  - Read the codebase to understand the relevant architecture, patterns, and conventions
  - Identify the files and modules that will need to change
  - Look for existing tests, related features, and potential conflicts
  - Note any ambiguities or open questions about the task
  - If the task description is unclear or missing critical details, ask the user for clarification before proceeding

  ## Important

  Your only job is research. Do NOT write a plan, write code, enter plan mode, or deploy anything. Only explore and read. When you have enough context, use `loom ai derive` to hand off to the planning step — include a summary of your findings in the derive description. If anything is unclear, use `loom ai ask` to get clarification from the user before proceeding.
