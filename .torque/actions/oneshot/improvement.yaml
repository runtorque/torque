name: oneshot/improvement
description: Improve existing functionality — refactoring, UX polish, performance, cleanup

agent:
  name_prefix: improve
  tab_color: "#d2a8ff"

implementation_depth: true

prompt: |
  {% if torque.context.is_clean %}
  You are improving existing functionality. This is a refinement — not a new feature, not a bug fix. Focus on making what exists work better: cleaner code, better UX, improved performance, or reduced complexity.

  ## Task

  {{ torque.task.title }}

  {% if torque.task.description %}
  ## Context

  {{ torque.task.description }}
  {% endif %}

  ## Approach

  - Read the relevant code first to understand what exists
  - Keep changes focused on the improvement described — don't expand scope
  - Preserve existing behavior unless the task explicitly asks to change it
  - Run the narrowest relevant tests or checks for the changed surface
  - End by stating files changed, improvement outcome, verification run, and remaining risk or live verification needed
  - Do NOT deploy the changes
  {% else %}
  You have a new task. Follow the same approach as before — read the relevant code, then improve it cleanly in one pass. Run the narrowest relevant tests, and close out with files changed, verification run, and remaining risk or live verification needed. Do NOT deploy the changes.

  ## Task

  {{ torque.task.title }}

  {% if torque.task.description %}
  ## Context

  {{ torque.task.description }}
  {% endif %}
  {% endif %}

labels:
  - improvement
