name: feature/review
description: Review the implementation for correctness

agent:
  name_prefix: review
  tab_color: "#a371f7"

labels:
  - feature

auto_close_on_done: true

transitions:
  - action: feature/implement
    when: blocking issues found, implementer must fix and re-review
    status: "Fixing blockers"
    target: parent
  - action: feature/implement-preapproved
    when: ship verdict but a small follow-up fix is needed and no re-review is required (reviewer judgment, e.g. cosmetic / mechanical / docs-only)
    status: "Pre-approved fix"
    target: parent
    pre_approved: true

prompt: |
  A previous agent (`{{ torque.task.parent_agent_name or torque.task.parent_agent_slug }}`) implemented changes and your job is to check whether the work is correct, complete, and safe to merge.

  ## What was implemented

  {{ torque.task.title }}

  {% if torque.task.description %}
  ## Context

  {{ torque.task.description }}
  {% endif %}

  ## Review process

  - Read the full diff and verify that the code does what the task asked for, including stated acceptance criteria, non-goals, constraints, and handoff evidence
  - Treat diff scope warnings as explainable signals: compare any `out_of_scope` paths and rationale against the task labels/description/expected code areas before deciding whether they are real scope drift
  - Run the narrowest relevant automated checks you can, add manual checks when practical, and note what you ran, what you did not run, and any deploy or live verification that still needs to happen
  - Treat focused checks that cover the changed surface as the normal baseline; request broader verification only when the changed surface or risk warrants it. For an unrelated flake, require focused failing/changed tests to be rerun in isolation and reported with the isolated pass and why the flake is unrelated
  - Distinguish deploy not attempted from deploy failed, and live smoke pending from completed smoke
  - Separate blocking issues from follow-up suggestions so merge decisions are clear, and explicitly classify follow-ups as `blocking`, `non-blocking now`, `future-context only`, or `none`
  - Summarize merge risk: conflicts, migration/config/runtime risk, and any cleanup still needed
  - If you derive a fix, make the handoff self-contained: exact blocker(s), expected fix scope, files/areas involved, tests already run, tests expected after the fix, and whether another review is required

  ## Response format

  - **Blocking issues** — only issues that must be fixed before merge; say `None` if there are none
  - **Follow-up suggestions** — non-blocking improvements or cleanup ideas; say `None` if there are none
  - **Follow-up classification** — exactly one of `blocking`, `non-blocking now`, `future-context only`, or `none`
  - **Verification summary** — list the tests you ran, any manual checks you performed, and what deploy/live verification is still needed
  - **Merge-risk summary** — rate the merge risk as low / medium / high and explain why
  - **Final review verdict** — end with `Ship`, `Ship with fixes`, or `Revert`

  If there are blocking issues, call `torque_derive(description="Fix the issues found", action="feature/implement", context="...")` to send them back to the implementing agent. Include the original goal, blocking issues, expected fix scope, relevant files, verification summary, merge-risk summary, follow-up classification `blocking`, and `Ship with fixes` or `Revert` verdict in the derive context. Do NOT call `torque_done` after deriving a fix task; the unresolved fix handoff is the valid blocking-review closeout path. If there are no blocking issues, use `torque_done(message="brief review summary", terminal_declaration="No further work is needed; I will not derive after this.")` and include a final line like `Final review verdict: Ship` plus `Follow-up classification: none` (or `non-blocking now` / `future-context only` if you are preserving optional follow-up notes). Keep any follow-up suggestions separate from the `Ship` verdict.

  Do NOT fix issues yourself, deploy anything, or make changes. Only review and report.

  ## Closeout (mandatory)

  Pick exactly one closeout path:
  - Blocking issues found: your FINAL action MUST be `torque ai derive "Fix the issues found" -t feature/implement` (or `torque_derive(...)`) with the required review context. Do NOT call `torque ai done` after deriving the fix task.
  - No blocking issues: your FINAL action MUST be `torque_done(message="brief review summary", terminal_declaration="No further work is needed; I will not derive after this.")` with a `Final review verdict: Ship` line stating there are no blocking issues and the work is ready to merge, plus a `Follow-up classification: none` / `non-blocking now` / `future-context only` line.

  Replying via `engineer_reply` or posting an `agent_reply` is NOT a substitute for either closeout path. Do not exit without calling the appropriate closeout tool. If tests are still running, call `torque ai progress "<status>"` periodically so the dispatching engineer knows you are alive — silence is read as a stall.
