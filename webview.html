<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Header -->
<header>
  <div id="conn-dot" title="Disconnected"></div>
  <h1>LOOM</h1>
  <button class="hdr-btn" onclick="restartDaemon()" title="Restart Loom">&#x21BB;</button>
  <button class="hdr-btn" onclick="openGlobalSettings()" title="Settings">&#9881;</button>
  <button class="hdr-btn" onclick="openAddGroup()">+ Group</button>
</header>

<!-- Main area (rendered by JS) -->
<main id="main"></main>

<!-- Broadcast bar -->
<div id="broadcast">
  <span id="broadcast-target"></span>
  <input id="broadcast-input" placeholder="Send to all..." autocomplete="off"
         onkeydown="if(event.key==='Enter')sendBroadcast();if(event.key==='Escape')closeBroadcast();">
  <button onclick="sendBroadcast()" title="Send">&#9654;</button>
  <button onclick="closeBroadcast()" title="Close">&#10005;</button>
</div>

<!-- Add Group modal -->
<div class="overlay" id="modal-group">
  <div class="modal">
    <h2>New Group</h2>
    <label>Group name</label>
    <input id="group-name-input" placeholder="e.g. frontend" autocomplete="off"
           onkeydown="if(event.key==='Enter')submitGroup();if(event.key==='Escape')closeModals();">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="submitGroup()">Create</button>
    </div>
  </div>
</div>

<!-- Add Agent / Terminal modal (shared) -->
<div class="overlay" id="modal-add">
  <div class="modal modal-tall">
    <h2 id="modal-add-title">New Agent</h2>
    <div class="gs-pane active" style="display:block">
      <label>Name</label>
      <input id="add-name-input" placeholder="e.g. Claude 1" autocomplete="off">
      <div id="add-icon-row">
        <label>Icon</label>
        <div class="icon-picker" id="add-icon-picker"></div>
      </div>
      <label>Group</label>
      <select id="add-group-select"></select>
      <div id="add-cmd-row" class="hidden">
        <label>Boot command</label>
        <input id="add-cmd-input" placeholder="e.g. npm run dev" autocomplete="off">
      </div>
      <div id="add-args-row" class="hidden">
        <label>Arguments</label>
        <input id="add-args-input" placeholder="e.g. --watch" autocomplete="off">
      </div>
      <div id="add-init-row" class="hidden">
        <label>Init script</label>
        <input id="add-init-input" placeholder="/path/to/script.sh" autocomplete="off">
      </div>
      <label>Directory</label>
      <select id="add-dir-select" onchange="onDirChange()"></select>
      <input id="add-dir-input" class="hidden" placeholder="Same as group"
             autocomplete="off" style="margin-top:4px">
      <label>Profile</label>
      <select id="add-profile-select"></select>
      <label>Shell</label>
      <select id="add-shell-select">
        <option value="">Same as group</option>
        <option value="zsh">zsh</option>
        <option value="bash">bash</option>
        <option value="fish">fish</option>
      </select>
      <label>Tab color</label>
      <div class="color-swatches" id="add-color-swatches"></div>
      <label>Additional environment <span class="label-hint">KEY=VALUE per line</span></label>
      <textarea id="add-env-vars" rows="2" placeholder="FOO=bar&#10;BAZ=qux"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="submitAdd()">Create</button>
    </div>
  </div>
</div>

<!-- Edit Agent/Terminal modal -->
<div class="overlay" id="modal-edit">
  <div class="modal">
    <h2 id="edit-title">Edit</h2>
    <label>Name</label>
    <input id="edit-name-input" autocomplete="off"
           onkeydown="if(event.key==='Enter')submitEdit();if(event.key==='Escape')closeModals();">
    <div id="edit-icon-row">
      <label>Icon</label>
      <div class="icon-picker" id="edit-icon-picker"></div>
    </div>
    <label>Tab color</label>
    <div class="color-swatches" id="edit-color-swatches"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="submitEdit()">Save</button>
    </div>
  </div>
</div>

<!-- Group Settings modal -->
<div class="overlay" id="modal-group-settings">
  <div class="modal modal-tall">
    <h2 id="gs-title">Group Settings</h2>
    <div class="gs-tabs">
      <button class="gs-tab active" data-tab="group" onclick="switchGsTab('group')">Group</button>
      <button class="gs-tab" data-tab="agents" onclick="switchGsTab('agents')">Agents</button>
      <button class="gs-tab" data-tab="terminals" onclick="switchGsTab('terminals')">Terminals</button>
    </div>

    <!-- Group tab -->
    <div class="gs-pane active" data-pane="group">
      <label>Directory</label>
      <input id="gs-directory" placeholder="/path/to/project" autocomplete="off">
      <label>Profile</label>
      <select id="gs-profile"></select>
      <label>Shell</label>
      <select id="gs-shell">
        <option value="">Default</option>
        <option value="zsh">zsh</option>
        <option value="bash">bash</option>
        <option value="fish">fish</option>
      </select>
      <label>Tab color</label>
      <div class="color-swatches" id="gs-color-swatches"></div>
      <label>Environment <span class="label-hint">KEY=VALUE per line</span></label>
      <textarea id="gs-env-vars" rows="3" placeholder="FOO=bar&#10;BAZ=qux"></textarea>
      <label>Auto-create terminals</label>
      <input id="gs-auto-terminals" type="number" min="0" max="10" value="0">
      <label>Max agents <span class="label-hint">0 = unlimited</span></label>
      <input id="gs-max-agents" type="number" min="0" max="100" value="0">
      <label class="gs-checkbox">
        <input id="gs-collapsed" type="checkbox"> Start collapsed on load
        <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Collapse this group automatically when the page loads. You can still expand it manually at any time.">?</span>
      </label>
      <label class="gs-checkbox">
        <input id="gs-filter-window" type="checkbox"> Pin to active window
        <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Only show this group in windows where it has active sessions. If all sessions are closed, the group appears in every window so you can relaunch.">?</span>
      </label>
    </div>

    <!-- Agents tab -->
    <div class="gs-pane" data-pane="agents">
      <div class="gs-subtabs">
        <button class="gs-subtab active" data-subtab="agent-general" onclick="switchGsSubTab('agents',this)">General</button>
        <button class="gs-subtab" data-subtab="agent-worktree" onclick="switchGsSubTab('agents',this)">Worktree</button>
        <button class="gs-subtab" data-subtab="agent-notifications" onclick="switchGsSubTab('agents',this)">Notifications</button>
      </div>

      <!-- General sub-tab -->
      <div class="gs-subpane active" data-subpane="agent-general">
        <label>Directory</label>
        <input id="gs-agent-directory" placeholder="Same as group" autocomplete="off">
        <label>Profile</label>
        <select id="gs-agent-profile"></select>
        <label>Shell</label>
        <select id="gs-agent-shell">
          <option value="">Same as group</option>
          <option value="zsh">zsh</option>
          <option value="bash">bash</option>
          <option value="fish">fish</option>
        </select>
        <label>Tab color</label>
        <div class="color-swatches" id="gs-agent-color-swatches"></div>
        <label>Boot command <span class="label-hint">override default</span></label>
        <input id="gs-agent-boot-cmd" placeholder="claude" autocomplete="off">
        <label>Additional environment <span class="label-hint">KEY=VALUE per line</span></label>
        <textarea id="gs-agent-env-vars" rows="3" placeholder="FOO=bar&#10;BAZ=qux"></textarea>
        <label class="gs-checkbox">
          <input id="gs-session-resume" type="checkbox" checked> Resume session on relaunch
          <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="When relaunching an agent, resume the previous conversation instead of starting fresh. Currently supported for Claude Code.">?</span>
        </label>
        <label>Idle timeout <span class="label-hint">minutes, 0 = disable</span></label>
        <input id="gs-agent-idle-timeout" type="number" min="0" max="60" value="5">
        <label class="gs-checkbox">
          <input id="gs-agent-always-custom" type="checkbox"> Always open custom dialog
          <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Show the full creation dialog when clicking New, instead of instantly creating an agent with default settings.">?</span>
        </label>
      </div>

      <!-- Worktree sub-tab -->
      <div class="gs-subpane" data-subpane="agent-worktree">
        <label class="gs-checkbox">
          <input id="gs-worktree" type="checkbox" onchange="_toggleWorktreeFields()"> Git worktree per agent
          <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Create a new git worktree and branch for each agent, so they can work on the same repo in parallel without conflicts.">?</span>
        </label>
        <div id="gs-wt-fields" style="display:none;padding-left:20px">
          <label>Worktree directory <span class="label-hint">relative to repo root</span></label>
          <input id="gs-wt-base-dir" placeholder=".loom/worktrees" autocomplete="off">
          <label>Base branch <span class="label-hint">empty = current HEAD</span></label>
          <input id="gs-wt-base-branch" placeholder="main" autocomplete="off">
          <label class="gs-checkbox">
            <input id="gs-wt-auto-checkpoint" type="checkbox"> Auto-checkpoint on stop
            <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Automatically commit all changes when an agent stops. Creates a checkpoint commit on the worktree branch.">?</span>
          </label>
          <label class="gs-checkbox">
            <input id="gs-wt-merge-squash" type="checkbox" checked> Squash commits on merge
            <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Squash all worktree commits into a single commit when merging to main. Keeps the main branch history clean.">?</span>
          </label>
          <label>Additional merge instructions
            <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Extra instructions appended to the merge prompt sent to Claude. Use this to customize merge behavior, e.g. 'Use a conventional commit message' or 'Run tests after merging'.">?</span>
          </label>
          <textarea id="gs-wt-merge-instructions" rows="2" placeholder="e.g. Use a conventional commit message"></textarea>
        </div>
      </div>

      <!-- Notifications sub-tab -->
      <div class="gs-subpane" data-subpane="agent-notifications">
        <label class="gs-checkbox">
          <input id="gs-notifications" type="checkbox"> Enable macOS notifications
          <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Send macOS notifications when agents in this group finish, encounter errors, or need attention. Notifications are batched over 5 seconds.">?</span>
        </label>
        <label class="gs-checkbox">
          <input id="gs-notify-finish" type="checkbox" checked> Notify on finish
        </label>
        <label class="gs-checkbox">
          <input id="gs-notify-error" type="checkbox" checked> Notify on error
        </label>
        <label class="gs-checkbox">
          <input id="gs-notify-attention" type="checkbox" checked> Notify when needs attention
        </label>
      </div>
    </div>

    <!-- Terminals tab -->
    <div class="gs-pane" data-pane="terminals">
      <label>Name prefix</label>
      <input id="gs-terminal-prefix" placeholder="e.g. Shell" autocomplete="off">
      <label>Boot command</label>
      <input id="gs-terminal-boot-cmd" placeholder="e.g. npm run dev" autocomplete="off">
      <label>Arguments</label>
      <input id="gs-terminal-cmd-args" placeholder="e.g. --watch" autocomplete="off">
      <label>Init script</label>
      <input id="gs-terminal-init-script" placeholder="/path/to/script.sh" autocomplete="off">
      <label>Directory</label>
      <input id="gs-terminal-directory" placeholder="Same as group" autocomplete="off">
      <label>Profile</label>
      <select id="gs-terminal-profile"></select>
      <label>Shell</label>
      <select id="gs-terminal-shell">
        <option value="">Same as group</option>
        <option value="zsh">zsh</option>
        <option value="bash">bash</option>
        <option value="fish">fish</option>
      </select>
      <label>Tab color</label>
      <div class="color-swatches" id="gs-terminal-color-swatches"></div>
      <label>Additional environment <span class="label-hint">KEY=VALUE per line</span></label>
      <textarea id="gs-terminal-env-vars" rows="3" placeholder="FOO=bar&#10;BAZ=qux"></textarea>
      <label class="gs-checkbox">
        <input id="gs-terminal-always-custom" type="checkbox"> Always open custom dialog
        <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Show the full creation dialog when clicking New, instead of instantly creating a terminal with default settings.">?</span>
      </label>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="submitGroupSettings()">Save</button>
    </div>
  </div>
</div>

<!-- Global Settings modal -->
<div class="overlay" id="modal-global-settings">
  <div class="modal modal-tall">
    <h2>Settings</h2>
    <div class="gs-tabs">
      <button class="gs-tab active" data-tab="gls-general" onclick="switchGlsTab('gls-general')">General</button>
      <button class="gs-tab" data-tab="gls-keybindings" onclick="switchGlsTab('gls-keybindings')">Keybindings</button>
    </div>

    <!-- General tab -->
    <div class="gs-pane active" data-pane="gls-general">
      <div class="gs-subtabs">
        <button class="gs-subtab active" data-subtab="gls-server" onclick="switchGlsSubTab(this)">Server</button>
        <button class="gs-subtab" data-subtab="gls-board" onclick="switchGlsSubTab(this)">Board</button>
      </div>

      <!-- Server sub-tab -->
      <div class="gs-subpane active" data-subpane="gls-server">
        <label>Default boot command
          <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)"
            data-hint="The command used when creating new agents without a custom boot command. Overrides the LOOM_DEFAULT_CMD environment variable.">?</span>
        </label>
        <input id="gls-default-cmd" placeholder="claude" autocomplete="off">
        <label class="gs-checkbox">
          <input id="gls-filter-window" type="checkbox" checked> Filter by active window
          <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)"
            data-hint="When enabled, only show agents belonging to the current iTerm2 window. Per-group 'Pin to active window' overrides this.">?</span>
        </label>
      </div>

      <!-- Board sub-tab -->
      <div class="gs-subpane" data-subpane="gls-board">
        <label>Default lanes <span class="label-hint">one per line, used for new installations</span></label>
        <textarea id="gls-default-lanes" rows="4" placeholder="Backlog&#10;To Do&#10;In Progress&#10;Done"></textarea>
      </div>
    </div>

    <!-- Keybindings tab -->
    <div class="gs-pane" data-pane="gls-keybindings">
      <div id="gls-keybinding-list"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="submitGlobalSettings()">Save</button>
    </div>
  </div>
</div>

<!-- Worktree History modal -->
<div class="overlay" id="modal-history">
  <div class="modal modal-tall">
    <h2 id="hist-title">History</h2>
    <div id="hist-branch" class="hist-branch-label"></div>
    <div id="hist-list" class="hist-list"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Close</button>
    </div>
  </div>
</div>

<!-- Template modal -->
<div class="overlay" id="modal-template">
  <div class="modal modal-tall">
    <h2 id="tpl-title">From Template</h2>
    <div id="tpl-list-pane">
      <div id="tpl-list" class="tpl-list"></div>
      <div class="tpl-empty hidden" id="tpl-empty">
        No templates found.<br>Add <code>.yaml</code> files to <code>.loom/templates/</code> in your project.
      </div>
    </div>
    <div id="tpl-vars-pane" class="hidden">
      <div id="tpl-description" class="tpl-description"></div>
      <div id="tpl-var-fields" class="modal-fields"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-cancel hidden" id="tpl-back-btn" onclick="_tplBack()">Back</button>
      <button class="btn-primary hidden" id="tpl-submit-btn" onclick="_tplSubmit()">Create</button>
    </div>
  </div>
</div>

<!-- Add/Edit Task modal -->
<div class="overlay" id="modal-task">
  <div class="modal modal-tall">
    <h2 id="task-modal-title">New Task</h2>
    <label>Task <span class="label-req">*</span>
      <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="An actionable task description, e.g. 'Create a summary of last week's deploys' instead of 'Weekly deploy report'.">?</span>
    </label>
    <input id="task-task-input" autocomplete="off"
           onkeydown="if(event.key==='Escape')closeModals();">
    <label>Group <span class="label-req">*</span></label>
    <select id="task-group-select"></select>
    <label>Assignee
      <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Agent name prefix for pool assignment (e.g. 'frontend'). Any agent matching this prefix can pick up the task.">?</span>
    </label>
    <input id="task-assignee-input" autocomplete="off">
    <label>Instructions
      <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Clear instructions on what the agent should do to complete this task.">?</span>
    </label>
    <textarea id="task-instructions-input" rows="3"></textarea>
    <label>Context
      <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Any additional context the agent might need — relevant files, background info, constraints.">?</span>
    </label>
    <textarea id="task-context-input" rows="2"></textarea>
    <label>Criteria
      <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Acceptance criteria for verifying completion. Also used by agents tasked with reviewing work.">?</span>
    </label>
    <textarea id="task-criteria-input" rows="2"></textarea>
    <label>Labels
      <span class="hint-btn" onclick="event.preventDefault();toggleHint(this)" data-hint="Comma-separated labels used for orchestration, e.g. 'urgent, frontend, deploy'.">?</span>
    </label>
    <input id="task-labels-input" autocomplete="off">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" id="task-submit-btn" onclick="submitTask()">Create</button>
    </div>
  </div>
</div>

<!-- Bottom Panel (collapsible, hosts panel apps) -->
<div id="bottom-panel" class="collapsed">
  <div class="panel-resize-handle" id="panel-resize-handle"></div>
  <div id="panel-board"></div>
  <div id="panel-templates" class="panel-hidden"></div>
</div>

<!-- Taskbar (dock for panel apps) -->
<div id="taskbar">
  <button class="taskbar-app" data-app="board" onclick="togglePanel('board')">&#9776; Board</button>
  <button class="taskbar-app" data-app="templates" onclick="togglePanel('templates')">&#9998; Templates</button>
</div>

<!-- Context menu (right-click) -->
<div id="ctx-menu"></div>

<!-- Confirm dialog (replaces window.confirm for WKWebView) -->
<div class="overlay" id="modal-confirm">
  <div class="modal">
    <p id="confirm-message"></p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="confirmNo()">Cancel</button>
      <button class="btn-primary btn-danger" onclick="confirmYes()">Remove</button>
    </div>
  </div>
</div>

<!-- JS (order matters: constants → ws → render → commands → modals → board → main) -->
<script src="/static/js/constants.js"></script>
<script src="/static/js/ws.js"></script>
<script src="/static/js/render.js"></script>
<script src="/static/js/commands.js"></script>
<script src="/static/js/modals.js"></script>
<script src="/static/js/board.js"></script>
<script src="/static/js/templates.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
