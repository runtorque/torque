id: product-manager-draft
version: '2'
base_kind: architect
display_name: Product Manager (draft)
description: Draft architect-derived Product Manager profile; enforced only when explicitly
  used as an effective profile.
lifecycle: draft
grants:
- observe.self_context
- observe.board_summary
- observe.task_detail
- planning.area_read
- planning.initiative_read
- decision.list
- decision.create_proposed
- decision.update_proposed
- decision.link
- task.create_queued
- task.update_planning_fields
- task.move_planning_safe
- task.board_sync_read
- behavior_overlay.propose_self
- behavior_overlay.read
- comm.user_ask
- comm.user_message
- comm.peer_architect_list
- comm.peer_architect_message
- comm.product_ack_request
- journal.private
denies:
- agent.hire_engineer
- agent.manage_engineer_roster
- agent.dispatch_worker
- task.create
- task.update
- task.reassign
- task.move
- task.dispatch
- comm.engineer_message
- comm.worker_message
- worktree.merge
- deploy.apply
- admin.settings
- profile.assign
- profile.edit
- decision.accept
acl:
  mode: allow
  allowed_families:
  - architect_product_*
  allowed_tools:
  - torque_context
  - architect_help_list
  - architect_help_show
  - architect_help_search
  - architect_help_query
  - architect_behavior_overlay_read
  - architect_behavior_overlay_versions
  - architect_behavior_overlay_diff
  - architect_behavior_overlay_proposal_list
  - architect_behavior_overlay_propose
  - architect_behavior_overlay_rollback
metadata:
  trusted_assignment: user_only_v1
  runtime_enforcement: mcp_projection_when_effective_profile_is_set
  wave_4b_wrapper_surface: architect_product_wrappers_only
