name: migrate
description: Migrate code from one pattern or API to another

agent:
  name_prefix: migrate
  tab_color: "#db61a2"

worktree: true

labels:
  - migration

task: |
  {{ TASK }}

instructions: |
  Migrate every occurrence systematically:
  1. Find all call sites / usages of the old pattern.
  2. Convert each one to the new pattern. Preserve existing behavior exactly.
  3. Remove the old code only after all usages are migrated.
  4. If the migration is too large for a single pass, leave a TODO with
     the pattern `TODO(migrate):` at any sites you couldn't convert and explain why.

context: |
  Old pattern: {{ OLD_PATTERN | default('(describe the old API or pattern)') }}
  New pattern: {{ NEW_PATTERN | default('(describe the new API or pattern)') }}

criteria: |
  - All tests pass: `{{ TEST_COMMAND | default('npm test') }}`
  - No remaining usages of the old pattern (unless marked with TODO)
  - The migration is mechanical — no unrelated changes
  - Removed code: the old implementation is deleted if fully migrated
