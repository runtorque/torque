name: feature/fix-review
description: Fix issues found during code review

agent:
  name_prefix: fix
  tab_color: "#f85149"

worktree: true

implementation_depth: true

labels:
  - review-fix

transitions:
  - action: feature/review
    when: all review issues have been addressed and the branch is ready for re-review

prompt: |
  You are fixing issues found by a code reviewer on this worktree branch. The reviewer flagged specific problems — your job is to address them systematically, not to re-implement or add new functionality.

  ## Original task

  {{ TASK }}

  ## Approach

  - Address every issue flagged as **critical** or **warning** — these are required
  - **Nits** are optional — fix them only if the change is trivial
  - Do not introduce new functionality or make unrelated changes
  - Run the test suite after your fixes to ensure nothing is broken
